name: Lint and Test

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # Menggunakan konfigurasi dari file .flake8 yang sudah ada
        flake8 app/ --count --config=.flake8
    - name: Test with pytest
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logistics_api
        SECRET_KEY: test_secret_key_ci
        ALGORITHM: HS256
        RAJA_ONGKIR_API_KEY: test_raja_ongkir_key
        REDIS_URL: memory://
        DEBUG_MODE: "True"
      run: |
        pytest tests/ -v
